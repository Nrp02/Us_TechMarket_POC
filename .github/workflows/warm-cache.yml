# Each Vercel deployment starts with an empty data cache, so after a production
# deploy every dated page would be slow for its first visitor. This opens them
# all once, against the deployment that just went live. Needs the repository
# secret CRON_SECRET (the same value as in Vercel). See
# src/app/api/warm-cache/route.ts.
name: Warm cache

on:
  deployment_status:
  workflow_dispatch:

jobs:
  warm:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - name: Open every dated page, one slice per request
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          URL: ${{ github.event.deployment_status.environment_url || 'https://ustechmarket.vercel.app' }}
        run: |
          for part in 0 1 2; do
            curl --fail-with-body -sS -m 90 -X POST -H "Authorization: Bearer $CRON_SECRET" "$URL/api/warm-cache?part=$part"
          done
